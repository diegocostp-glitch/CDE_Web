<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDE — Recebimento de Salmão</title>
<link rel="icon" type="image/png" href="centurion_aba.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/navegacao.js"></script>
</head>
<body class="light">
<div class="app-layout">
<main class="main-content">
  <div class="screen-header">
    <div>
      <h1>Recebimento de Salmão</h1>
      <p>A OC diz o que foi pedido; o fornecedor manda o pedido real (o salmão nunca vem
         na quantidade exata); a loja confere o que chegou com este documento.</p>
    </div>
    <div class="header-acoes"><span id="estado" class="estado"></span></div>
  </div>

  <div class="barra">
    <nav class="abas abas-cad" id="filtro">
      <button data-f="aguardando_real" class="ativa">Aguardando pedido real <b data-n="aguardando_real"></b></button>
      <button data-f="aguardando_recebimento">Aguardando recebimento <b data-n="aguardando_recebimento"></b></button>
      <button data-f="conferido">Conferidos</button>
      <button data-f="">Todos</button>
    </nav>
  </div>

  <div id="lista"></div>
</main>
</div>

<!-- documento impresso que a loja leva para a conferência -->
<div id="doc-rec" class="doc-rec"></div>

<div id="aviso" class="aviso-flut" hidden></div>
<script src="js/comum.js"></script>
<script>montarSidebar("recebimento")</script>
<script src="js/recebimento.js"></script>
</body>
</html>
