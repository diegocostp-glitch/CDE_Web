<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDE — Trocar senha</title>
<link rel="icon" type="image/png" href="centurion_aba.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="tema-novo/tema.css">
<script src="js/navegacao.js"></script>
<script src="tema-novo/tema.js"></script>
<script>
// Esta pagina e so a troca obrigatoria da senha provisoria (o servidor manda
// para ca com ?primeira=1). A troca do dia a dia mora em Configuracoes.
if (!new URLSearchParams(location.search).get("primeira")) location.replace("parametros.html#senha");
</script>
</head>
<body class="light">
<!-- Mesmo enquadramento do login: cartao no centro da tela, sem menu, porque
     nada mais abre antes de a senha provisoria ser trocada. -->
<main class="login-pagina">
  <section class="cartao login-cartao">
    <div class="login-marca">
      <img src="centurion_menu.png" alt="">
      <div><h1>Escolha sua senha</h1><p id="sub">Vale para todos os computadores e para o celular.</p></div>
    </div>
    <div class="sem-custo">Esta é uma senha provisória, criada pelo administrador.
      Escolha a sua para continuar.</div>
    <form id="f" class="form-senha">
      <label class="campo"><span>Senha provisória</span>
        <input id="atual" type="password" autocomplete="current-password" required></label>
      <label class="campo"><span>Nova senha (mínimo 8 caracteres)</span>
        <input id="nova" type="password" autocomplete="new-password" required></label>
      <label class="campo"><span>Repita a nova senha</span>
        <input id="nova2" type="password" autocomplete="new-password" required></label>
      <p class="login-erro" id="erro" role="alert"></p>
      <button class="botao primario login-botao" type="submit">Salvar e entrar</button>
    </form>
  </section>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  try { document.body.className = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
  $("#atual").focus();
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    $("#erro").textContent = "";
    if ($("#nova").value !== $("#nova2").value) { $("#erro").textContent = "As duas senhas não são iguais."; return; }
    const r = await fetch("/api/senha", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ atual: $("#atual").value, nova: $("#nova").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $("#erro").textContent = j.erro || "não foi possível trocar"; return; }
    location.href = "/";
  };
})();
</script>
</body>
</html>
