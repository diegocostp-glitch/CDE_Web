<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDE — Importar OC</title>
<link rel="icon" type="image/png" href="logo_aba.png">
<link rel="stylesheet" href="css/style.css">
<!-- as mesmas versoes do Gerador de OCs: planilha, PDF de saida, leitura de PDF e zip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/navegacao.js"></script>
</head>
<body class="light">
<div class="app-layout">

<main class="main-content">
  <div class="screen-header">
    <div>
      <h1>Importar OC</h1>
      <p>Leia a planilha de solicitação da equipe ou o PDF da OC. Cada fornecedor
         encontrado vira uma ordem pendente em Ordens de Compras.</p>
    </div>
    <div class="header-acoes">
      <span id="estado" class="estado"></span>
    </div>
  </div>

  <section class="barra">
    <label class="campo campo-largo"><span>Unidade compradora</span>
      <select id="unidade"></select></label>
    <label class="campo"><span>Nº da OC inicial</span>
      <input type="number" id="numero" min="1" placeholder="automático" style="width:150px"></label>
    <span class="fonte" id="dica-numero"></span>
  </section>

  <section class="cartao">
    <div class="zona-envio" id="zona">
      <input type="file" id="arquivo" accept=".xlsx,.xlsm,.csv,.pdf">
      <div class="zona-ico">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/><line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="16" y2="17"/><line x1="12" y1="11" x2="12" y2="19"/>
        </svg>
      </div>
      <div class="zona-txt">Arraste a planilha (.xlsx) ou o PDF da OC — ou clique para escolher</div>
    </div>

    <div class="arquivo-escolhido" id="escolhido" hidden>
      <strong id="nome-arquivo"></strong>
      <span style="flex:1"></span>
      <button class="botao primario" id="btn-ler">Ler arquivo</button>
      <button class="botao" id="btn-cancelar">Cancelar</button>
    </div>
  </section>

  <div id="recado"></div>
  <div id="resultado"></div>
</main>
</div>
<script>montarSidebar("importar")</script>

<div id="aviso" class="aviso-flut" hidden></div>
<script src="js/comum.js"></script>
<script src="js/header-img.js"></script>
<script src="js/oc-pdf.js"></script>
<script src="js/importar-pdf.js"></script>
<script src="js/importar.js"></script>
<script src="js/acoes.js"></script>
</body>
</html>
