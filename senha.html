<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDE — Trocar senha</title>
<link rel="icon" type="image/png" href="centurion_aba.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/navegacao.js"></script>
</head>
<body class="light">
<div class="app-layout">
<main class="main-content">
  <div class="screen-header">
    <div><h1>Trocar senha</h1><p id="sub">Sua senha vale para todos os computadores e para o celular.</p></div>
  </div>
  <section class="cartao" style="max-width:460px">
    <div class="sem-custo" id="aviso-primeira" hidden>Esta é uma senha provisória, criada pelo administrador.
      Escolha a sua para continuar.</div>
    <form id="f" class="form-senha">
      <label class="campo"><span>Senha atual</span>
        <input id="atual" type="password" autocomplete="current-password" required></label>
      <label class="campo"><span>Nova senha (mínimo 8 caracteres)</span>
        <input id="nova" type="password" autocomplete="new-password" required></label>
      <label class="campo"><span>Repita a nova senha</span>
        <input id="nova2" type="password" autocomplete="new-password" required></label>
      <p class="login-erro" id="erro" role="alert"></p>
      <button class="botao primario" type="submit">Salvar nova senha</button>
      <p class="fonte">Ao trocar, os outros aparelhos em que você estava logado saem e pedem a senha nova.</p>
    </form>
  </section>
</main>
</div>
<script>montarSidebar("senha")</script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const primeira = new URLSearchParams(location.search).get("primeira");
  if (primeira) $("#aviso-primeira").hidden = false;
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    $("#erro").textContent = "";
    if ($("#nova").value !== $("#nova2").value) { $("#erro").textContent = "As duas senhas não são iguais."; return; }
    const r = await fetch("/api/senha", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ atual: $("#atual").value, nova: $("#nova").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $("#erro").textContent = j.erro || "não foi possível trocar"; return; }
    e.target.reset();
    $("#erro").textContent = "";
    $("#sub").textContent = "Senha trocada.";
    if (primeira) location.href = "/";
  };
})();
</script>
</body>
</html>
